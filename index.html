<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ringette E-Junior Shift Timer</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: background-color 0.2s;
}

#timer {
    font-size: min(32vw, 260px);
    font-weight: bold;
    line-height: 1;
    user-select: none;
}

#changeText {
    position: fixed;
    top: 8%;
    left: 50%;
    transform: translateX(-50%);
    font-size: min(12vw, 120px);
    font-weight: bold;
    color: white;
    display: none;
    text-shadow:
        0 0 20px black,
        0 0 40px black;
    pointer-events: none;
}

.controls {
    margin-top: 2rem;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.8rem;
}

button {
    font-size: 1.8rem;
    padding: 0.5rem 1.2rem;
    border: none;
    border-radius: 12px;
    cursor: pointer;
}

.start { background:#2ecc71; }
.pause { background:#f1c40f; }
.reset { background:#3498db; }

.orange {
    background:#ff8800;
}

.red {
    background:#cc0000;
}

.flash {
    animation: flash 0.5s infinite;
}

@keyframes flash {
    0%,100% { background:#aa0000; }
    50% { background:#ff0000; }
}
</style>
</head>

<body>

<div id="changeText">CHANGE</div>
<div id="timer">0.0</div>

<div class="controls">
    <button class="start" onclick="startTimer()">Start</button>
    <button class="pause" onclick="pauseTimer()">Pause</button>
    <button class="reset" onclick="resetTimer()">Reset</button>
    <button onclick="adjustTime(-1)">-1 s</button>
    <button onclick="adjustTime(1)">+1 s</button>
</div>

<script>

let running = false;
let startTime = 0;
let elapsed = 0;

let wakeLock = null;

let beep50Played = false;
let alarm70Played = false;

const timerEl = document.getElementById("timer");
const changeEl = document.getElementById("changeText");

function shortBeep() {

    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine";
    osc.frequency.value = 900;

    osc.connect(gain);
    gain.connect(ctx.destination);

    gain.gain.setValueAtTime(0.25, ctx.currentTime);

    osc.start();
    osc.stop(ctx.currentTime + 0.15);
}

function loudAlarm() {

    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    for (let i = 0; i < 6; i++) {

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "square";
        osc.frequency.value = 1200;

        osc.connect(gain);
        gain.connect(ctx.destination);

        const t = ctx.currentTime + i * 0.25;

        gain.gain.setValueAtTime(0.4, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);

        osc.start(t);
        osc.stop(t + 0.2);
    }
}

function updateDisplay() {

    timerEl.textContent = elapsed.toFixed(1);

    document.body.classList.remove(
        "orange",
        "red",
        "flash"
    );

    if (elapsed >= 70) {

        document.body.classList.add(
            "red",
            "flash"
        );

        if (!alarm70Played) {
            alarm70Played = true;
            loudAlarm();
        }

    } else if (elapsed >= 50) {

        document.body.classList.add("orange");

        if (!beep50Played) {
            beep50Played = true;
            shortBeep();
            changeEl.style.display = "block";
        }
    }
}

function update() {

    if (!running) return;

    elapsed =
        (performance.now() - startTime) / 1000;

    updateDisplay();

    requestAnimationFrame(update);
}

function startTimer() {

    if (running) return;

    running = true;

    startTime =
        performance.now() -
        elapsed * 1000;

    requestAnimationFrame(update);

    requestWakeLock();
    requestFullscreen();
}

function pauseTimer() {
    running = false;
}

function resetTimer() {

    running = false;

    elapsed = 0;

    beep50Played = false;
    alarm70Played = false;

    changeEl.style.display = "none";

    document.body.classList.remove(
        "orange",
        "red",
        "flash"
    );

    timerEl.textContent = "0.0";
}

function adjustTime(delta) {

    elapsed =
        Math.max(0, elapsed + delta);

    if (running) {
        startTime =
            performance.now() -
            elapsed * 1000;
    }

    updateDisplay();
}

async function requestWakeLock() {

    try {

        if ("wakeLock" in navigator) {

            wakeLock =
                await navigator.wakeLock.request(
                    "screen"
                );
        }

    } catch (e) {
        console.log(e);
    }
}

async function requestFullscreen() {

    try {

        if (!document.fullscreenElement) {

            await document.documentElement
                .requestFullscreen();
        }

    } catch (e) {
        console.log(e);
    }
}

document.addEventListener(
    "visibilitychange",
    async () => {

        if (
            wakeLock &&
            document.visibilityState === "visible"
        ) {

            try {
                wakeLock =
                    await navigator.wakeLock.request(
                        "screen"
                    );
            } catch {}
        }
    }
);

document.addEventListener(
    "keydown",
    e => {

        if (e.code === "Space") {

            e.preventDefault();

            running
                ? pauseTimer()
                : startTimer();
        }

        if (e.code === "Enter") {
            resetTimer();
        }

        if (e.code === "ArrowLeft") {
            adjustTime(-1);
        }

        if (e.code === "ArrowRight") {
            adjustTime(1);
        }
    }
);

</script>

</body>
</html>
